    maxq_fraction: {value: 0.83, basis: assumed}
    liquid_fraction: {value: 0.0, basis: official}
    max_supply_c: {value: 27, basis: official, note: "ASHRAE recommended air inlet; chilled water runs ~18 C to hold it"}
    return_limit_c: {value: 40, basis: assumed}
    gpu_memory_gb: {value: 80, basis: official}
    perf:
      inference: {compute: 1.0, claim: 1.0}
      training: {compute: 1.0, claim: 1.0}
    rack_capex_usd_m: {value: 1.2, basis: reported}
