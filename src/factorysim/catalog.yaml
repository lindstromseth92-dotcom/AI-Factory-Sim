# Hardware catalog.
#
# Every number carries a `basis` tag so you can tell what is solid and what is not:
#   official  - published by NVIDIA or an OEM spec sheet
#   reported  - secondary source (analyst, press, colo guide); not confirmed by NVIDIA
#   derived   - computed here from official/reported numbers (math shown in docs/MODEL.md)
#   assumed   - my assumption; change it if you know better
#
# Performance is an index relative to one H100 = 1.0.
#   compute: ratio of per-GPU peak compute from NVIDIA's own spec tables
#   claim:   NVIDIA's published full-stack speedup claim, compounded across generations
# The dashboard's "vendor claim credit" slider blends between the two (geometric).

reference:
  # Aggregate output tokens/s from one H100 serving the reference LLM with batching.
  # Pure anchor for absolute numbers. All comparisons are ratios and do not depend on it.
  h100_tokens_per_sec: {value: 1000, basis: assumed}
  # Fraction of MaxP rack power drawn at zero utilization.
  idle_power_fraction: {value: 0.30, basis: assumed}
  # perf(cap) = 1 - k * (1 - cap)^2, cap = power limit as a fraction of MaxP.
  # Inference k is fitted to NVIDIA's one public MaxLPS data point
  # (1.4x GPUs at the same site power -> 1.35x tokens, Vera Rubin, 1 MW, PUE 1.1).
  power_cap_curve:
    inference_k: {value: 0.44, basis: derived}
    training_k: {value: 1.00, basis: assumed}
    min_cap: {value: 0.50, basis: assumed}

platforms:
