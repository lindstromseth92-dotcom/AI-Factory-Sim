    maxq_fraction: {value: 0.83, basis: assumed}
    liquid_fraction: {value: 0.90, basis: reported, note: "NVIDIA GTC 2025: 90 plus percent liquid cooled"}
    max_supply_c: {value: 45, basis: reported}
