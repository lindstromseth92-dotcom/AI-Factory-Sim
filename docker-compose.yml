# docker compose up --build
#   dashboard    http://localhost:8000
#   event bus    mqtt://localhost:1883   (NATS with MQTT enabled, the same shape as DSX Exchange)
#   prometheus   http://localhost:9090   (scrapes the DCGM-style metrics)
services:
  sim:
    build: .
    ports: ["8000:8000"]
    environment:
      DSX_MQTT_URL: mqtt://bus:1883
    depends_on: [bus]

  bus:
    image: nats:2-alpine
    command: ["-c", "/etc/nats/nats.conf"]
    volumes: ["./deploy/nats.conf:/etc/nats/nats.conf:ro"]
    ports: ["1883:1883", "4222:4222", "8222:8222"]

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes: ["./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
    depends_on: [sim]
