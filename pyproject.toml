[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-factory-sim"
version = "0.1.0"
description = "A teaching simulator for an AI factory: grid power in, tokens out, with NVIDIA DSX-style controls."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "numpy>=1.26",
  "pyyaml>=6",
  "paho-mqtt>=2.0",
  "pyjwt[crypto]>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
factorysim = "factorysim.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
factorysim = ["catalog.yaml", "static/*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
