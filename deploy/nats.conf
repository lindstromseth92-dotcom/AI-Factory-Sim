# NATS with the MQTT gateway on. DSX Exchange's event bus is NATS underneath and
# speaks MQTT to facility and IT systems; this is the smallest config that does both.
# The real thing adds an auth callout (OAuth2, mTLS) and per-identity topic permissions.
server_name: dsx-bus
http_port: 8222

jetstream {
  store_dir: /data
}

mqtt {
  port: 1883
}
